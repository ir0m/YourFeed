[project]
name = "yourfeed"
version = "0.1.0"
description = "A self-hosted feed that searches the web and summarizes what it finds"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pypdf>=6,<7",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
